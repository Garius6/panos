name: Deploy сайт (доки + web-песочница) на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # T057 (specs/010-zig-migration): panos.wasm теперь собирается Zig-
      # тулчейном (`zig build browser` — `panos-browser.wasm`, ReleaseSmall
      # уже задан в build.zig, тот же принцип "маленький размер обязателен",
      # что у Odin's -o:size — см. build.zig's browser executable). Zig сам
      # тащит свой линкер (нет отдельного system-пакета вроде lld/wasm-ld,
      # который нужен был Odin) — шаг "Установить wasm-ld" больше не нужен.
      - name: Установить Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"

      # mkdir обязателен: demo/ не содержит других отслеживаемых файлов
      # (index.html/odin.js убраны из git) — git не хранит пустые
      # директории, значит на чистом checkout'е demo/ физически не
      # существует.
      - name: Собрать panos.wasm
        run: |
          mkdir -p demo
          zig build browser
          cp zig-out/bin/panos-browser.wasm demo/panos.wasm

      # mdBook публикует готовые бинарники в своих GitHub Releases — проще
      # и надёжнее скачать напрямую, чем тянуть отдельный marketplace-экшен
      # ради одной команды. Версия пинится (как и Zig выше) вместо
      # "latest", чтобы сборка не ломалась незамеченным апдейтом.
      - name: Установить mdbook
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv mdbook /usr/local/bin/

      # Интерактивные блоки кода в docs/ (см. docs/src/assets/interactive.js)
      # запускают тот же panos.wasm через свой собственный минимальный
      # WASM-раннер — нужна копия рядом с исходниками книги ДО mdbook build
      # (mdBook копирует любой не-md файл из src/ как статический ассет).
      - name: Собрать документацию
        run: |
          cp demo/panos.wasm docs/src/assets/panos.wasm
          mdbook build docs

      # Один Pages-сайт на репозиторий — доки в корне (первая точка входа),
      # песочница на /playground/ (относительные пути внутри demo/index.html
      # — odin.js, panos.wasm — не зависят от префикса, переносить их
      # не нужно).
      - name: Собрать сайт
        run: |
          mkdir -p site
          cp -r docs/book/. site/
          mkdir -p site/playground
          cp -r demo/. site/playground/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

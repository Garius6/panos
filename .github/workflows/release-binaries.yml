name: Собрать бинарники и создать релиз

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (должен уже существовать, например v0.3.6)"
        required: true
        type: string
      include_windows:
        description: "Собрать также windows-amd64 (сейчас падает, см. комментарий у matrix — включать только вручную для отладки)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Собрать ${{ matrix.suffix }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-amd64
            ext: ""

          - os: macos-14
            suffix: macos-arm64
            ext: ""

          # windows-2022: native-таргет zig на этом раннере резолвится в
          # GNU/MinGW ABI по умолчанию, а external/libffi/lib/windows-amd64/
          # libffi.lib собран под MSVC — lld-link не находит
          # libLIBCMT.a/libOLDNAMES.a. Падает с v0.3.0, не починено. Матрица
          # включает эту запись всегда, но КАЖДЫЙ шаг ниже пропускается
          # (`if: matrix.os != 'windows-2022' || inputs.include_windows`),
          # если явно не запросили `include_windows: true` при ручном
          # запуске — так job виден в списке (не молча отсутствует), но
          # реально не собирается и не валит остальную матрицу.
          - os: windows-2022
            suffix: windows-amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить исходники
        if: matrix.os != 'windows-2022' || inputs.include_windows
        uses: actions/checkout@v4

      # T057 (specs/010-zig-migration): release binaries now come from the
      # Zig toolchain (`build.zig`), not Odin — same 3-platform matrix
      # `zig-ci.yml` (T051) already validates on every push/PR, so a
      # release build is never the FIRST time this exact platform/optimize
      # combination has been compiled.
      - name: Установить Zig
        if: matrix.os != 'windows-2022' || inputs.include_windows
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Собрать panos
        if: matrix.os != 'windows-2022' || inputs.include_windows
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast

      - name: Собрать panos-lsp
        if: matrix.os != 'windows-2022' || inputs.include_windows
        shell: bash
        run: |
          set -euo pipefail
          zig build lsp -Doptimize=ReleaseFast

      - name: Подготовить файлы релиза
        if: matrix.os != 'windows-2022' || inputs.include_windows
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            "zig-out/bin/panos${{ matrix.ext }}" \
            "dist/panos-${{ matrix.suffix }}${{ matrix.ext }}"

          cp \
            "zig-out/bin/panos-lsp${{ matrix.ext }}" \
            "dist/panos-lsp-${{ matrix.suffix }}${{ matrix.ext }}"

      - name: Сохранить результат сборки
        if: matrix.os != 'windows-2022' || inputs.include_windows
        uses: actions/upload-artifact@v4
        with:
          name: panos-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Создать GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Скачать бинарники всех платформ
        uses: actions/download-artifact@v4
        with:
          pattern: panos-*
          path: dist
          merge-multiple: true

      - name: Проверить состав релиза
        shell: bash
        env:
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        run: |
          set -euo pipefail

          test -f dist/panos-linux-amd64
          test -f dist/panos-lsp-linux-amd64
          test -f dist/panos-macos-arm64
          test -f dist/panos-lsp-macos-arm64

          if [ "$INCLUDE_WINDOWS" = "true" ]; then
            test -f dist/panos-windows-amd64.exe
            test -f dist/panos-lsp-windows-amd64.exe
          fi

          find dist -maxdepth 1 -type f -print

      - name: Создать релиз и приложить бинарники
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # publish-джоба не делает checkout (нужны только скачанные
          # артефакты, не исходники) — без .git gh не может определить
          # репозиторий сам ("fatal: not a git repository"). GH_REPO
          # заставляет gh работать через API, не пытаясь трогать git.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

name: Zig CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: zig build test (${{ matrix.suffix }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-amd64

          - os: macos-14
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Установить Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Реальные `.wasm`-модули (`panos build --target=wasm`, T048) и
      # runtime-тесты (T044) исполняются через настоящий `wasmtime run
      # --invoke`, не просто структурно проверяются — но каждый такой тест
      # имеет `catch |err| { if (err == error.FileNotFound) return
      # error.SkipZigTest; ... }`, так что отсутствие wasmtime в PATH не
      # роняет CI, только скипает подмножество тестов молча. Устанавливаем
      # его здесь явно, чтобы CI реально гонял эти тесты, а не полагался на
      # скип. Официальный install-скрипт (не сторонний Action —
      # проверяемое, стабильное поведение) сам PATH не расширяет за
      # пределы своего собственного шага — `$GITHUB_PATH` дописывается
      # явно ниже.
      #
      # ВЕРСИЯ ЗАФИКСИРОВАНА (--version), не "latest" — их install.sh без
      # аргумента резолвит "latest" через НЕаутентифицированный GitHub API
      # (`api.github.com/.../releases/latest`), который на shared-раннерах
      # GitHub Actions периодически хватает rate-limit/пустой ответ; сам
      # install.sh на этот случай не проверяет ошибку и подставляет пустую
      # строку как версию — `curl` затем валится на "nested brace in URL"
      # (реальный, воспроизведённый инцидент). Фиксированная версия убирает
      # сетевой запрос к их API целиком — обновлять здесь вручную по мере
      # выхода новых релизов wasmtime, не автоматически.
      - name: Установить wasmtime
        shell: bash
        run: |
          set -euo pipefail
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v48.0.0
          # Официальный установщик только пишет PATH-экспорт в shell-профиль
          # (`~/.bashrc` и т.п.) — следующий шаг workflow это не прочитает,
          # нужно явно продлить `$GITHUB_PATH` на весь остаток job'а.
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: zig build test
        run: zig build test --summary all

      - name: zig build conformance
        run: zig build conformance --summary all

      # `integration`/`aot`/`bench` used to be bundled into the single
      # `test` step (before it was split into fast-unit-only, see
      # AGENTS.md §"Команды") — each needs its OWN explicit CI step now so
      # CI doesn't silently lose the coverage the old combined step gave
      # for free. `-Doptimize=ReleaseFast` on `bench` matches
      # `tests/conformance/benchmarks.md`'s own documented methodology —
      # Debug-mode `фиб(30)` alone takes minutes.
      - name: zig build integration
        run: zig build integration --summary all

      - name: zig build aot
        run: zig build aot --summary all

      - name: zig build -Doptimize=ReleaseFast bench
        run: zig build -Doptimize=ReleaseFast bench --summary all

      - name: zig build lsp
        run: zig build lsp

      - name: zig build browser
        run: zig build browser

      - name: zig build aot-runtime-wasi
        run: zig build aot-runtime-wasi

      - name: zig build aot-runtime-js
        run: zig build aot-runtime-js

  # windows-amd64 — MANUAL ONLY (`workflow_dispatch`), not run on every
  # push/PR. All real compile/link bugs on this platform were found and
  # fixed already (libc/FFI resolution, MSVC CRT linking, env/stdin
  # builtins). After that, `zig build test` started intermittently
  # hanging or failing with `CONNECTION_REFUSED` deep inside Zig
  # 0.16.0's own `std.Io.Threaded`/`netConnectIpWindows` internals — not
  # panos code, reproduces on unrelated tests each time (once a plain
  # FFI test, once a SQLite test), consistent with a loopback-socket
  # cross-thread-wakeup primitive flaking under the GH Windows runner's
  # network sandboxing. Burned 20+ minutes per run without ever pointing
  # at anything fixable here — see
  # project_panos_windows_ci_io_threaded_flake memory. Kept runnable via
  # "Run workflow" in the Actions UI (or `gh workflow run`) for spot-
  # checking Windows without blocking every ordinary push.
  test-windows:
    name: zig build test (windows-amd64, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Установить Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # `zig build` on `x86_64-windows` links against the REAL MSVC CRT
      # import libs (`libLIBCMT.a`/`libOLDNAMES.a`, needed here because
      # `внешний`/FFI and sqlite3/libffi are all `-lc`) — Visual Studio
      # Build Tools ARE preinstalled on `windows-2022` runners, but their
      # `LIB`/`INCLUDE`/`PATH` env vars are only set inside a "Developer
      # Command Prompt", which this job isn't running in by default.
      # `ilammy/msvc-dev-cmd` runs the equivalent of `vcvarsall.bat` and
      # exports those vars into `$GITHUB_ENV` for every step after it.
      - name: Настроить MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # `install.ps1` stopped existing — wasmtime.dev now serves only an
      # `.msi` installer for Windows, not a script. Skip the `.msi`
      # (needs `msiexec`, a real system-level install, registry lookups
      # to find where it landed) — the release also ships a plain `.zip`
      # with just `wasmtime.exe` inside, matching the same "download,
      # extract, extend PATH" shape the Linux/macOS step uses.
      #
      # Version PINNED (not "latest" resolved via the GitHub API) — the
      # macOS/Linux job hit a real incident where the unauthenticated
      # `releases/latest` API call from a shared GitHub Actions runner IP
      # got rate-limited/empty, and the installer had no error handling
      # for that, silently breaking the whole CI run. Same API call here,
      # same exposure — pinned to avoid the network dependency entirely.
      # Update this tag by hand when bumping the macOS/Linux pin above.
      - name: Установить wasmtime
        shell: pwsh
        run: |
          $version = "v48.0.0"
          $assetUrl = "https://github.com/bytecodealliance/wasmtime/releases/download/$version/wasmtime-$version-x86_64-windows.zip"
          Invoke-WebRequest -Uri $assetUrl -OutFile "$env:RUNNER_TEMP\wasmtime.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wasmtime.zip" -DestinationPath "$env:RUNNER_TEMP\wasmtime" -Force
          $extractedDir = Get-ChildItem -Path "$env:RUNNER_TEMP\wasmtime" -Directory | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $extractedDir.FullName

      # Zig's "native" target detection on Windows defaults to the
      # `-gnu` ABI (self-hosted mingw) — but this Zig version's mingw
      # import-lib synthesis for `-lc` (`libLIBCMT.a`/`libOLDNAMES.a`)
      # doesn't work here (confirmed: identical missing-file error on a
      # local macOS→x86_64-windows-gnu CROSS-compile too, not
      # `windows-2022`-specific). Forcing the ACTUAL `-msvc` ABI
      # sidesteps the broken mingw path entirely.
      - name: zig build test
        run: zig build test -Dtarget=x86_64-windows-msvc --summary all

      - name: zig build conformance
        run: zig build conformance -Dtarget=x86_64-windows-msvc --summary all

      - name: zig build integration
        run: zig build integration -Dtarget=x86_64-windows-msvc --summary all

      - name: zig build aot
        run: zig build aot -Dtarget=x86_64-windows-msvc --summary all

      - name: zig build -Doptimize=ReleaseFast bench
        run: zig build -Doptimize=ReleaseFast bench -Dtarget=x86_64-windows-msvc --summary all

      - name: zig build lsp
        run: zig build lsp -Dtarget=x86_64-windows-msvc

      - name: zig build browser
        run: zig build browser -Dtarget=x86_64-windows-msvc

      - name: zig build aot-runtime-wasi
        run: zig build aot-runtime-wasi

      - name: zig build aot-runtime-js
        run: zig build aot-runtime-js

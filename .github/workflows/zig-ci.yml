name: Zig CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: zig build test (${{ matrix.suffix }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-amd64
            target_flag: ""

          - os: macos-14
            suffix: macos-arm64
            target_flag: ""

          # Zig's "native" target detection on Windows defaults to the
          # `-gnu` ABI (self-hosted mingw, no external toolchain needed in
          # theory) — but this Zig version's mingw import-lib synthesis for
          # `внешний`/FFI's `-lc` (`libLIBCMT.a`/`libOLDNAMES.a`) doesn't
          # work here (confirmed: identical missing-file error on a local
          # macOS→x86_64-windows-gnu CROSS-compile too, so it's not
          # `windows-2022`-specific). `ilammy/msvc-dev-cmd` above already
          # sets up a real MSVC toolchain — forcing the ACTUAL `-msvc` ABI
          # sidesteps the broken mingw path entirely.
          - os: windows-2022
            suffix: windows-amd64
            target_flag: "-Dtarget=x86_64-windows-msvc"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Установить Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # `zig build` on `x86_64-windows` links against the REAL MSVC CRT
      # import libs (`libLIBCMT.a`/`libOLDNAMES.a`, needed here because
      # `внешний`/FFI and sqlite3/libffi are all `-lc`) — Visual Studio
      # Build Tools ARE preinstalled on `windows-2022` runners, but their
      # `LIB`/`INCLUDE`/`PATH` env vars are only set inside a "Developer
      # Command Prompt", which this job isn't running in by default.
      # `ilammy/msvc-dev-cmd` runs the equivalent of `vcvarsall.bat` and
      # exports those vars into `$GITHUB_ENV` for every step after it.
      - name: Настроить MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Реальные `.wasm`-модули (`panos build --target=wasm`, T048) и
      # runtime-тесты (T044) исполняются через настоящий `wasmtime run
      # --invoke`, не просто структурно проверяются — но каждый такой тест
      # имеет `catch |err| { if (err == error.FileNotFound) return
      # error.SkipZigTest; ... }`, так что отсутствие wasmtime в PATH не
      # роняет CI, только скипает подмножество тестов молча. Устанавливаем
      # его здесь явно, чтобы CI реально гонял эти тесты, а не полагался на
      # скип. Официальные install-скрипты (не сторонний Action —
      # проверяемое, стабильное поведение) сами PATH не расширяют за
      # пределы своего собственного шага — `$GITHUB_PATH` дописывается
      # явно ниже.
      - name: Установить wasmtime (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl https://wasmtime.dev/install.sh -sSf | bash
          # Официальный установщик только пишет PATH-экспорт в shell-профиль
          # (`~/.bashrc` и т.п.) — следующий шаг workflow это не прочитает,
          # нужно явно продлить `$GITHUB_PATH` на весь остаток job'а.
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      # `install.ps1` (used above until this fix) stopped existing —
      # wasmtime.dev now serves only an `.msi` installer for Windows,
      # not a script (confirmed: `irm https://wasmtime.dev/install.ps1`
      # returns a GitHub Pages 404, breaking every Windows CI run).
      # Skip the `.msi` (needs `msiexec`, a real system-level install,
      # registry lookups to find where it landed) — the release also
      # ships a plain `.zip` with just `wasmtime.exe` inside, matching
      # the same "download, extract, extend PATH" shape the Linux/macOS
      # step above already uses. Resolves "latest" via the GitHub API
      # at run time instead of pinning a version here, so this doesn't
      # go stale the same way `install.ps1` did.
      - name: Установить wasmtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/bytecodealliance/wasmtime/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "wasmtime-*-x86_64-windows.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\wasmtime.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wasmtime.zip" -DestinationPath "$env:RUNNER_TEMP\wasmtime" -Force
          $extractedDir = Get-ChildItem -Path "$env:RUNNER_TEMP\wasmtime" -Directory | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $extractedDir.FullName

      - name: zig build test
        run: zig build test ${{ matrix.target_flag }} --summary all

      - name: zig build conformance
        run: zig build conformance ${{ matrix.target_flag }} --summary all

      # `integration`/`aot`/`bench` used to be bundled into the single
      # `test` step (before it was split into fast-unit-only, see
      # AGENTS.md §"Команды") — each needs its OWN explicit CI step now so
      # CI doesn't silently lose the coverage the old combined step gave
      # for free. `-Doptimize=ReleaseFast` on `bench` matches
      # `tests/conformance/benchmarks.md`'s own documented methodology —
      # Debug-mode `фиб(30)` alone takes minutes.
      - name: zig build integration
        run: zig build integration ${{ matrix.target_flag }} --summary all

      - name: zig build aot
        run: zig build aot ${{ matrix.target_flag }} --summary all

      - name: zig build -Doptimize=ReleaseFast bench
        run: zig build -Doptimize=ReleaseFast bench ${{ matrix.target_flag }} --summary all

      - name: zig build lsp
        run: zig build lsp ${{ matrix.target_flag }}

      - name: zig build browser
        run: zig build browser ${{ matrix.target_flag }}

      - name: zig build aot-runtime-wasi
        run: zig build aot-runtime-wasi

      - name: zig build aot-runtime-js
        run: zig build aot-runtime-js
